[project]
name = "huddle-cli"
version = "0.1.0"
description = "CLI client for Huddle group reasoning sessions"
requires-python = ">=3.10"
dependencies = [
    "click>=8.1",
    "websockets>=12.0",
    "httpx>=0.27",
]

[project.scripts]
huddle = "huddle_cli.cli:main"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["huddle_cli*"]